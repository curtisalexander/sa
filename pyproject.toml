[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "sa"
version = "0.1.1"
description = "Keep a Windows machine awake"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"

[project.urls]
Homepage = "https://github.com/curtisalexander/sa"

[tool.maturin]
bindings = "bin"
manifest-path = "Cargo.toml"
module-name = "sa"
python-source = "python"
strip = true
