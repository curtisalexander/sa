name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check
      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run tests
        # Exercises SetThreadExecutionState against the real Win32 API.
        run: cargo test --locked

  # sa builds everywhere so its logic can be tested off Windows; keep it that way.
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --locked

  build:
    needs: [test, portable]
    # Only build the wheel on push to main — PRs only need tests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64-pc-windows-msvc
          args: --release --locked --out dist
      - name: Smoke test the wheel
        shell: pwsh
        run: |
          pip install --find-links dist --no-index sa
          # Resolve the scripts dir rather than trusting PATH.
          $scripts = python -c "import sysconfig; print(sysconfig.get_path('scripts'))"
          & "$scripts\sa.exe" --version
          & "$scripts\sa.exe" --help
          # --for 2s exits on its own, so it proves the Win32 call round-trips.
          & "$scripts\sa.exe" --for 2s
          if ($LASTEXITCODE -ne 0) { throw "sa --for 2s exited $LASTEXITCODE" }
      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheel-x86_64-pc-windows-msvc
          path: dist/*.whl

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Get version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Download wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          files: dist/*.whl
